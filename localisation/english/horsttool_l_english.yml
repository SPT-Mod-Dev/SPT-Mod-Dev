 pause_blocker_status_tt:0 "§HPause Blocker Function§!"
 pause_blocker_status_delayed_tt:0 "By default anyone can pause the game, but if you want to restrict pausing to just the host (you) or majors then you can select the 'Majors Only' setting (first on the list) or 'Host Only' setting to prevent pausing by most or all other nations.Or you can use the individual pause settings for each nation."

