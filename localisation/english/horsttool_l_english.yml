 FIX_AI_CONTROL:0 "§HFix AI Control§!\nFixes the glitch where the AI is enabled on a player's country\n\n"
 FIX_AI_CONTROL_DELAYED:0 "Briefly parks the player of the selected country on a dummy nation, then automatically returns them after 2 in-game hours. Re-assigning the human resets the game's control flag and removes the ghost AI.\n\nUnpause for a moment so the return can fire. One player at a time - the button is greyed out while a fix is in progress."


 BUILDING_MENU:0 "§HState Builder§!\nToggle the building +/- panel\n\n"
 BUILDING_MENU_DELAYED:0 "Opens a panel under the host tool with +/- buttons for 8 building types. They apply to ALL marked states if any are marked, otherwise the selected state."

 HT_BLD_ADD_TT:0 "§GAdd one level§! of this building - to ALL marked states if any are marked, otherwise the selected state (instant)"
 HT_BLD_REM_TT:0 "§RRemove one level§! of this building - from ALL marked states if any are marked, otherwise the selected state"

 HT_WP_TT:0 "§HWhite Peace§!\nTwo countries: peace between the selected and marked country\nOne country: it peaces out of ALL its wars\n\n"
 HT_WP_TT_DELAYED:0 "One button, two modes. Mark a state of one country and select a state of a DIFFERENT country to end only the war between those two. Mark or select a single country on its own and that country is white peaced out of every war it is in."
 HT_TRUCE_CLR_TT:0 "§HClear Truce§!\nMark one country's state, select the other, click\n\n"
 HT_TRUCE_CLR_TT_DELAYED:0 "Clears the truce in both directions so an agreed war can happen immediately. Mark a state of one country and select a state of the other."
 HT_WG_TT:0 "§HDelete War Goals§!\nWipes ALL justifications between two countries, both directions\n\n"
 HT_WG_TT_DELAYED:0 "Mark a state of one country and select a state of the other. Every justification type between the two is removed, in both directions."
 HT_FADD_TT:0 "§HJoin Faction§!\nMark a state of any faction member, select the joiner's state, click\n\n"
 HT_FADD_TT_DELAYED:0 "Mark one state of ANY country in the destination faction, then select a state of the country that should join and press this. The tool finds the faction leader itself."
 HT_FKICK_TT:0 "§HKick from Faction§!\nKicks the SELECTED country out of its current faction\n\n"
 HT_FKICK_TT_DELAYED:0 "No marking or pickers needed - select a state of the country and press this. Faction leaders cannot be kicked from their own faction."

 HT_AUTO_UP_TT:0 "§HRaise Autonomy§!\nSelected subject moves one level up (toward Dominion)\n\n"
 HT_AUTO_DOWN_TT:0 "§HLower Autonomy§!\nSelected subject moves one level down (toward Integrated Puppet)\n\n"
 HT_AUTO_TT_DELAYED:0 "Steps the standard ladder: Integrated Puppet - Puppet - Colony - Dominion. Only works if the selected state's owner is already a subject. Use Puppet / Free Country for entering or leaving subject status; special modded subject types are not touched."

 HT_FUNC_TT:0 "§HFocus: Undo Mode§!\nToggle the focus UNDO picker for the selected country\n\n"
 HT_FCOM_TT:0 "§HFocus: Add Mode§!\nToggle the focus COMPLETE picker for the selected country\n\n"
 HT_FOCUS_TT_DELAYED:0 "Select a state of the country first, then toggle this mode. A new decision category appears on YOUR country listing that country's focuses - Undo mode lists completed focuses, Add mode lists not-yet-completed ones. Click a decision to apply it. Toggle the mode off when done."

 hosttool.63.desc:0 "§YAre you sure?§!\n\n§R[ht_annexed_country.GetName] ([ht_annexed_country.GetTag])§! will be annexed into §G[ht_annexer_country.GetName] ([ht_annexer_country.GetTag])§!.\n\nAll of [ht_annexed_country.GetName]'s states, troops and equipment will be transferred, and every annexed state will become a core of [ht_annexer_country.GetName]."
 hosttool.63.desc_req:0 "§YAre you sure?§!\n\n§R[ht_req_annexed.GetName] ([ht_req_annexed.GetTag])§! will be annexed into §G[ht_req_annexer.GetName] ([ht_req_annexer.GetTag])§!.\n\nAll of [ht_req_annexed.GetName]'s states, troops and equipment will be transferred, and every annexed state will become a core of [ht_req_annexer.GetName]."

 host_tool_focus_category:0 "Host Tool - Focus Picker"
 host_tool_focus_category_desc:0 "Host-only focus surgery. Undo mode lists the picked country's completed focuses; Add mode lists its not-yet-completed ones. Toggle the mode off in the host tool when done."

 hosttool.7.desc:0 "The host used the host tool."
 hosttool.69.t:0 "Host Tool"
 hosttool.69.desc:0 "The host did something with the host tool."
 hosttool.69.a:0 "Nice"
 HT_LAW_TT:0 "§HLaws Mode§!\nToggle the economy/trade/mobilization law changer for the selected country\n\n"
 HT_LAW_TT_DELAYED:0 "Select a state of the target country first, then toggle this. A decision category appears on YOUR country listing every economy, trade, and mobilization law - click one to set it on the marked country. Mutually exclusive with the focus/spirit modes. Toggle off when done."
 HT_SPIRIT_ADD_TT:0 "§HIdeas: Add Mode§!\nToggle the idea ADD picker for the selected country\n\n"
 HT_SPIRIT_REM_TT:0 "§HIdeas: Remove Mode§!\nToggle the idea REMOVE picker for the selected country\n\n"
 HT_SPIRIT_TT_DELAYED:0 "Select a state of the target country first, then toggle Add or Rem. A decision category appears on YOUR country: Rem lists the ideas that country currently HAS; Add lists the ideas its focus tree(s) can grant that it lacks. Click one to apply. Only ideas with a proper name are listed - unnamed internal ideas are not. Mutually exclusive with focus/law modes. Toggle off when done."

 HT_POL_TT:0 "§HPolitics§!\nToggle the party-popularity and government panel\n\n"
 HT_POL_TT_DELAYED:0 "Opens a panel under the host tool with +/- buttons for each ideology's party popularity and a button to force the ruling party. Everything here applies to the §Yselected state's owner§!. Shares space with the State Builder, so opening one closes the other."
 HT_POL_ADD_TT:0 "§GAdd 10%§! popularity to this party for the selected state's owner"
 HT_POL_SUB_TT:0 "§RRemove 10%§! popularity from this party for the selected state's owner"
 HT_POL_GOV_TT:0 "§HSet Government§!\nForce the selected state's owner to this ruling ideology. Democratic re-enables elections; the others disable them.\n\n"
 host_tool_law_category:0 "Host Tool - Laws"
 host_tool_law_category_desc:0 "Host-only: set any law on the marked state's owner."
 host_tool_spirit_category:0 "Host Tool - Ideas"
 host_tool_spirit_category_desc:0 "Host-only: add or remove ideas on the marked state's owner."
