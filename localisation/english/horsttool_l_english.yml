 CLEAR_ALL_MARKINGS:0 "§HClear Every single mark§!\nResets all host tool settings including marked states, target/receiver countries, pause blocking, and cheat selection\n\n"
 CLEAR_ALL_MARKINGS_DELAYED:0 "This is the big red button that resets everything. Use it when you want to refresh the host tool or remove something you did not want to select."

 TRANSFER_OCCUPATION:0 "§HTransfer Occupation§!\nHand CONTROL (occupation) of the marked states to [This.Owner.GetName] - ownership is untouched.\nMark the occupied states, select a state of the receiving country, then click.\n\n"
 TRANSFER_OCCUPATION_DELAYED:0 ""
 TRANSFER_STATES:0 "§HTransfer States§!\nTransfer marked states to [This.Owner.GetName]\n\n"
 TRANSFER_STATES_DELAYED:0 "Moves ownership of every marked state to the selected country. It does NOT grant cores - use Give Cores for that - so a transfer can be undone by transferring the states back."
 
